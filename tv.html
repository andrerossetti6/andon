<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV | Chão de Fábrica</title>
    <meta name="description" content="Modo TV — telão do chão de fábrica (atualiza sozinho)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#0D1117">
    <style>
        body{display:block;overflow:hidden;padding:0;cursor:none;}
        .tv{max-width:none;height:100vh;display:flex;flex-direction:column;padding:28px 36px;gap:20px;}
        .tv-head{display:flex;align-items:baseline;gap:18px;}
        .tv-head h1{font-family:'Outfit';font-size:2rem;}
        .tv-head h1 span{color:var(--indigo-primary);}
        .tv-head .dia{color:var(--text-dim);font-size:1rem;}
        .tv-head .hora{margin-left:auto;font-family:'Outfit';font-size:3.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
        .tv-strip{display:flex;gap:16px;}
        .tv-kpi{flex:1;background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:18px 22px;box-shadow:var(--shadow-1);}
        .tv-kpi .l{font-size:.8rem;letter-spacing:.08em;color:var(--text-dim);font-weight:700;display:flex;gap:8px;align-items:center;}
        .tv-kpi .v{font-family:'Outfit';font-size:3rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;}
        .tv-kpi .s{font-size:.82rem;color:var(--text-dim);}
        .tv-kpi.ok .v{color:var(--ok);} .tv-kpi.bad .v{color:var(--bad);} .tv-kpi.warn .v{color:var(--warn);} .tv-kpi.info .v{color:var(--indigo-primary);}
        .tv-mapa{flex:1;background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:22px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;}
        .tv-mapa .titulo{font-family:'Outfit';font-size:1.2rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
        .tv-mapa .mapa-wrap{flex:1;display:flex;align-items:center;}
        .tv-mapa .mapa-wrap>div{width:100%;}
        .tv-foot{display:flex;justify-content:space-between;color:var(--text-dim);font-size:.8rem;}
        .tv-andon{border:2px solid var(--bad);border-radius:16px;padding:14px 20px;background:rgba(248,81,73,.08);display:none;align-items:center;gap:14px;animation:mapaPulseBad 1.6s ease-in-out infinite;}
        .tv-andon .icon{width:30px;height:30px;color:var(--bad);}
        .tv-andon b{color:var(--bad);font-size:1.15rem;}
        .tv-andon span{font-size:1rem;color:var(--text-main);}
    </style>
</head>
<body class="sin1-layout">
<div class="tv">
    <div class="tv-head">
        <h1>Malha <span>Forte</span></h1>
        <span class="dia" id="tv-dia">—</span>
        <span class="hora" id="tv-hora">--:--</span>
    </div>

    <div class="tv-andon" id="tv-andon"></div>

    <div class="tv-strip">
        <div class="tv-kpi info"><div class="l" id="tvk-prod-l">EM PRODUÇÃO</div><div class="v" id="tvk-prod">—</div><div class="s">OPs com sessão agora</div></div>
        <div class="tv-kpi"><div class="l" id="tvk-turno-l">PEÇAS DO TURNO</div><div class="v" id="tvk-turno">—</div><div class="s">apontadas nas sessões abertas</div></div>
        <div class="tv-kpi" id="tvk-andon-box"><div class="l" id="tvk-andon-l">ANDON</div><div class="v" id="tvk-andon">—</div><div class="s">chamados abertos</div></div>
        <div class="tv-kpi" id="tvk-rup-box"><div class="l" id="tvk-rup-l">RUPTURAS</div><div class="v" id="tvk-rup">—</div><div class="s">pulmões em preto</div></div>
    </div>

    <div class="tv-mapa">
        <div class="titulo" id="tv-mapa-titulo">Mapa da fábrica</div>
        <div class="mapa-wrap"><div id="tv-mapa"></div></div>
    </div>

    <div class="tv-foot">
        <span>verde = rodando · âmbar = fila parada · vermelho = Andon · atualiza a cada 30 s</span>
        <span id="tv-atualizado">—</span>
    </div>
</div>

<script src="ui-icons.js"></script>
<script>
(function () {
    // token: ?token= grava e limpa a URL (mesmo padrão dos sistemas)
    const qs = new URLSearchParams(location.search);
    if (qs.get('token')) { localStorage.setItem('sin1_token', qs.get('token')); history.replaceState({}, '', location.pathname); }
    const H = () => ({ Authorization: 'Bearer ' + (localStorage.getItem('sin1_token') || '') });
    const get = u => fetch(u, { headers: H() }).then(r => r.ok ? r.json() : null).catch(() => null);

    document.getElementById('tvk-prod-l').innerHTML = icon('pulso', 'icon sm') + ' EM PRODUÇÃO';
    document.getElementById('tvk-turno-l').innerHTML = icon('pacote', 'icon sm') + ' PEÇAS DO TURNO';
    document.getElementById('tvk-andon-l').innerHTML = icon('alerta', 'icon sm') + ' ANDON';
    document.getElementById('tvk-rup-l').innerHTML = icon('fio', 'icon sm') + ' RUPTURAS';
    document.getElementById('tv-mapa-titulo').innerHTML = icon('fabrica') + ' Mapa da fábrica';

    function relogio() {
        const d = new Date();
        document.getElementById('tv-hora').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('tv-dia').textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
    }

    async function atualiza() {
        const [mapa, andon, pulm, aps] = await Promise.all([
            get('/api/mf/mapa'), get('/api/mf/andon'), get('/api/n1/pulmoes'), get('/api/mf/apontamentos?abertas=1'),
        ]);
        if (mapa?.etapas) {
            renderMapaFabrica(document.getElementById('tv-mapa'), mapa.etapas);
            const emProd = mapa.etapas.reduce((s, e) => s + e.sessoes, 0);
            const pecas = mapa.etapas.reduce((s, e) => s + (e.pecas_turno || 0), 0);
            document.getElementById('tvk-prod').textContent = emProd;
            document.getElementById('tvk-turno').textContent = Math.round(pecas).toLocaleString('pt-BR');
        }
        const abertos = Array.isArray(andon) ? andon.filter(a => a.status !== 'resolvido') : [];
        const kA = document.getElementById('tvk-andon'); kA.textContent = abertos.length;
        document.getElementById('tvk-andon-box').className = 'tv-kpi ' + (abertos.length ? 'bad' : 'ok');
        const faixa = document.getElementById('tv-andon');
        if (abertos.length) {
            const a = abertos[0];
            faixa.style.display = 'flex';
            faixa.innerHTML = icon('alerta') + `<b>ANDON — ${(a.tipo || '').toUpperCase()}</b>` +
                `<span>${a.etapa?.nome ? a.etapa.nome + ' · ' : ''}${a.descricao || ''}${a.op?.numero ? ' · OP ' + a.op.numero : ''}</span>` +
                (abertos.length > 1 ? `<span style="margin-left:auto;color:var(--text-dim);">+${abertos.length - 1} chamado(s)</span>` : '');
        } else faixa.style.display = 'none';
        if (pulm?.resumo) {
            document.getElementById('tvk-rup').textContent = pulm.resumo.preto || 0;
            document.getElementById('tvk-rup-box').className = 'tv-kpi ' + (pulm.resumo.preto ? 'warn' : 'ok');
        }
        document.getElementById('tv-atualizado').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR');
    }

    relogio(); setInterval(relogio, 10000);
    atualiza(); setInterval(atualiza, 30000);
})();
</script>
</body>
</html>
